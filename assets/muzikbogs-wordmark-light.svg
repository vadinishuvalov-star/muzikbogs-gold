<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 510 1020 200" width="1020" height="200" role="img" aria-label="МЮЗИКБОГС">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d3208"/><stop offset="26%" stop-color="#8a5c14"/>
      <stop offset="62%" stop-color="#b8842c"/><stop offset="100%" stop-color="#5e3e0b"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c1d10"/><stop offset="26%" stop-color="#9b3a26"/>
      <stop offset="62%" stop-color="#c2643c"/><stop offset="100%" stop-color="#6d2817"/>
    </linearGradient>
    <filter id="emboss" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4a3210" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g font-family="Arial Narrow,Arial,sans-serif" font-weight="900" font-size="170" filter="url(#emboss)">
    <text x="110" y="660" fill="url(#gold)" textLength="544" lengthAdjust="spacingAndGlyphs">МЮЗИК</text>
    <text x="654" y="660" fill="url(#copper)" textLength="327" lengthAdjust="spacingAndGlyphs">БОГ</text>
    <text x="981" y="660" fill="url(#gold)" textLength="109" lengthAdjust="spacingAndGlyphs">С</text>
  </g>
</svg>
